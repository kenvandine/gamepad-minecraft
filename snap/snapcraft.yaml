name: gamepad-minecraft
base: core24
version: '0.1.0'
summary: A controller-first Minecraft Java launcher for handhelds
description: |
  gamepad-minecraft is a Rust/GTK4 launcher for Minecraft Java Edition,
  purpose-built for Ubuntu handheld gaming devices (Lenovo Legion Go S,
  MSI Claw). Sign in once with a Microsoft account via a QR-code
  device-code flow, then play fully offline afterward using a cached
  profile - no keyboard or mouse required at any point. New instances get
  Fabric Loader and the Controlify mod injected automatically so
  Minecraft's own title screen is gamepad-navigable too.

  Minecraft Java Edition itself is not distributed in this snap - the
  first launch requires network access to download it directly from
  Mojang, the same as the official launcher.

grade: stable
confinement: strict

icon: data/icons/com.github.gamepadminecraft.svg

apps:
  gamepad-minecraft:
    command: bin/gamepad-minecraft
    desktop: share/applications/com.github.gamepadminecraft.desktop
    extensions: [gnome]
    plugs:
      - network            # device-code login, Xbox/Mojang exchange, downloads
      - network-bind       # reserved for a possible future LAN-play feature
      - joystick           # /dev/input/js*, /dev/input/event* (ID_INPUT_JOYSTICK)
      - opengl             # launcher UI and Minecraft's own rendering
      - audio-playback
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - process-control    # spawn/monitor the bundled java child process
      - removable-media    # reserved for storing instances on a MicroSD card
    environment:
      HOME: $SNAP_USER_COMMON

parts:
  gamepad-minecraft:
    plugin: rust
    source: .
    # Same fix as gamepad-2048: the gnome extension prepends its SDK's own
    # libc to LD_LIBRARY_PATH for the build step, but that libc is
    # incompatible with the rustup/cargo/rustc binaries (snap), causing
    # "symbol lookup error: ...libc.so.6: undefined symbol:
    # __nptl_change_stack_perm". Rust's toolchain doesn't need the GNOME
    # SDK's libraries at invocation time (only pkg-config/headers do, via
    # PKG_CONFIG_PATH), so clear it here.
    build-environment:
      - LD_LIBRARY_PATH: ""

  jre:
    plugin: nil
    stage-packages:
      # Current Minecraft releases ship JVM arguments newer JDKs
      # introduced (e.g. --sun-misc-unsafe-memory-access=allow, part of
      # the sun.misc.Unsafe deprecation work) that Java 21 doesn't
      # recognize at all and refuses to start with. Track the current
      # OpenJDK LTS rather than pinning to 21.
      - openjdk-25-jre-headless
    # Only needed at build time, to regenerate cacerts below - not
    # staged into the snap itself.
    build-packages:
      - ca-certificates
    # Strict confinement forbids exec'ing arbitrary host binaries, so the
    # JRE is staged inside the snap; launch.rs invokes
    # $SNAP/usr/lib/jvm/java-25-openjdk-amd64/bin/java directly.
    #
    # Two real-hardware-confirmed gaps in a bare `prime` of just the JVM
    # tree, both traced via AVC "DENIED" entries plus manually walking
    # every symlink under java-25-openjdk-amd64/conf and lib/security:
    #
    # 1. $JAVA_HOME/conf/security/java.security - the file
    #    sun.security.jca.Providers reads to build its provider list -
    #    is a *symlink* to /etc/java-25-openjdk/security/java.security,
    #    which openjdk-25-jre-headless does own, but which the original
    #    `prime` list (just the JVM tree) excluded from the snap
    #    entirely. Once that class's static initializer fails, the JVM
    #    permanently marks it erroneous, so every later reference just
    #    throws a bare, uninformative NoClassDefFoundError - which is
    #    what surfaced (misleadingly) inside Fabric Loader's KnotClient.
    #    Fixed by also priming etc/java-25-openjdk.
    # 2. $JAVA_HOME/lib/security/cacerts is *also* a symlink, to
    #    /etc/ssl/certs/java/cacerts - but that file isn't owned by any
    #    package's static file list at all (`dpkg -S` finds nothing for
    #    it). It only ever exists because ca-certificates-java's
    #    postinst trigger script generates it at install time, and
    #    snapcraft's stage-packages never runs postinst/trigger
    #    scripts (it only unpacks .deb contents). Fixed below by
    #    rebuilding the keystore directly from the system's PEM CA
    #    bundle with keytool - verified end-to-end with a real HTTPS
    #    request before landing this.
    override-build: |
      craftctl default
      JAVA_HOME="$CRAFT_PART_INSTALL/usr/lib/jvm/java-25-openjdk-amd64"
      rm -f "$JAVA_HOME/lib/security/cacerts"
      split_dir="$CRAFT_PART_BUILD/ca-certs-split"
      rm -rf "$split_dir"
      mkdir -p "$split_dir"
      csplit -s -z -f "$split_dir/cert-" -b "%03d.pem" \
        /etc/ssl/certs/ca-certificates.crt '/-----BEGIN CERTIFICATE-----/' '{*}'
      for cert in "$split_dir"/cert-*.pem; do
        "$JAVA_HOME/bin/keytool" -importcert -noprompt \
          -keystore "$JAVA_HOME/lib/security/cacerts" \
          -storepass changeit \
          -alias "$(basename "$cert" .pem)" \
          -file "$cert"
      done
    prime:
      - usr/lib/jvm/java-25-openjdk-amd64
      - etc/java-25-openjdk

  data:
    plugin: dump
    source: data
    organize:
      com.github.gamepadminecraft.desktop: share/applications/com.github.gamepadminecraft.desktop
      icons/com.github.gamepadminecraft.png: share/icons/hicolor/256x256/apps/com.github.gamepadminecraft.png
      icons/com.github.gamepadminecraft.svg: share/icons/hicolor/scalable/apps/com.github.gamepadminecraft.svg
