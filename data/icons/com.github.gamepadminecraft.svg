<?xml version="1.0" encoding="UTF-8"?>
<!-- gamepad-minecraft application icon. Copyright (C) 2026 Ken VanDine. SPDX-License-Identifier: GPL-3.0-or-later -->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A0E2A"/>
      <stop offset="55%" stop-color="#2C001E"/>
      <stop offset="100%" stop-color="#1B0D16"/>
    </linearGradient>
    <linearGradient id="grassTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#689F38"/>
    </linearGradient>
    <linearGradient id="dirtLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A4A2B"/>
      <stop offset="100%" stop-color="#5D3620"/>
    </linearGradient>
    <linearGradient id="dirtRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5D3620"/>
      <stop offset="100%" stop-color="#472712"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App icon background, matching the family's rounded aubergine frame -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="244" height="244" rx="52" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3"/>

  <!-- Isometric grass block, evoking Minecraft's iconic cube without
       reproducing any of its actual artwork or wordmark -->
  <g filter="url(#softShadow)">
    <!-- Top face -->
    <polygon points="128,42 200,84 128,126 56,84" fill="url(#grassTop)"/>
    <!-- Left (lit) face -->
    <polygon points="56,84 128,126 128,208 56,166" fill="url(#dirtLeft)"/>
    <!-- Right (shadowed) face -->
    <polygon points="200,84 128,126 128,208 200,166" fill="url(#dirtRight)"/>

    <!-- A thin strip of grass overhang on each side face, matching the
         classic grass-block silhouette -->
    <polygon points="56,84 128,126 128,138 56,96" fill="#7CB342" opacity="0.9"/>
    <polygon points="200,84 128,126 128,138 200,96" fill="#689F38" opacity="0.75"/>

    <!-- Blocky pixel-texture speckles, kept subtle so the shape reads
         clearly at small sizes -->
    <g opacity="0.18" fill="#000000">
      <rect x="72" y="150" width="10" height="10"/>
      <rect x="96" y="170" width="10" height="10"/>
      <rect x="70" y="185" width="10" height="10"/>
      <rect x="150" y="150" width="10" height="10"/>
      <rect x="176" y="172" width="10" height="10"/>
      <rect x="152" y="188" width="10" height="10"/>
    </g>
  </g>

  <!-- D-pad glyph badge, bottom-right corner accent nodding to
       gamepad-shell/gamepad-2048's controller emblem -->
  <g transform="translate(196, 196)" opacity="0.92">
    <circle cx="20" cy="20" r="26" fill="#150610" fill-opacity="0.55"/>
    <path d="M 20 6 L 26 14 L 14 14 Z" fill="#FFFFFF"/>
    <path d="M 20 34 L 26 26 L 14 26 Z" fill="#FFFFFF"/>
    <path d="M 6 20 L 14 14 L 14 26 Z" fill="#FFFFFF"/>
    <path d="M 34 20 L 26 14 L 26 26 Z" fill="#FFFFFF"/>
  </g>
</svg>
